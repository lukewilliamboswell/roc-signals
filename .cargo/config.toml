[env]
# Keep a shared Cargo target directory from reusing another checkout's host.
SIGNALS_HOST_SOURCE_ROOT = { value = ".", relative = true, force = true }

# FreeType is an independently released Roc link input. Suppress freetype-sys's
# pkg-config probe and bundled C fallback, including when pkg-config is missing.
[target.x86_64-unknown-linux-gnu.freetype]
rustc-link-lib = ["dylib=freetype"]
