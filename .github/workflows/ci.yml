name: CI

# Every Linux job runs a Blueprint task, so CI and contributors run the same
# commands: `blueprint run check` is the pull-request gate (the release dry
# run included), and `blueprint run site` builds the site, its API docs and
# its live examples. The macOS and Windows jobs run apps' specs with the
# spec runner `roc build` makes there, as an app author on that system does. A push to main also deploys that build to GitHub Pages,
# so the published site always matches main.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The latest Roc nightly, resolved once so every job of this run tests
  # with the same `roc` (roc-automation's model: the package compiler floats;
  # only the scripts' `roc-stable` is pinned in Blueprint.roc).
  nightly:
    name: Resolve the Roc nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.nightly.outputs.tag }}
    steps:
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

  check:
    name: Check
    needs: nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@14a895879f6fea8c2d1a546a2a56c8502decb2a0
        with:
          cache: 'true'
          cache-workload: engine
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.nightly.outputs.tag }}
      - run: blueprint check
      - run: blueprint run check

  # The spec runner's link inputs for every system, cross-compiled on Linux
  # with the pinned Zig exactly as the release builds them.
  spec-inputs:
    name: Spec runner inputs
    needs: nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@14a895879f6fea8c2d1a546a2a56c8502decb2a0
        with:
          cache: 'true'
          cache-workload: engine
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.nightly.outputs.tag }}
      - run: blueprint run platform
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: spec-inputs
          path: platform/targets/
          if-no-files-found: error
          retention-days: 3

  # Building shows a system's link inputs are whole (`check` cross-links
  # them); only the system itself shows the runner works there. Each runner
  # builds a small app's and the worker apps' spec runners from those
  # inputs, as an app author on that system does, and runs their specs:
  # worker jobs in child processes, a crashing job, preparations, deadlines
  # and the file services. Then two specs that must fail: one expecting the
  # wrong fault class for a crash, and one whose job never finishes, which
  # the runner ends at its 30 s bound.
  native-specs:
    name: Specs on ${{ matrix.name }}
    needs: [nightly, spec-inputs]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-15, target: arm64mac, exe: '' }
          - { name: macOS (Intel), os: macos-15-intel, target: x64mac, exe: '' }
          - { name: Windows, os: windows-2025, target: x64win, exe: .exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: spec-inputs
          path: platform/targets
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.nightly.outputs.tag }}
      - env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
          BUILD: .build/native
        run: |
          failed=0
          for app in examples/form-builder tests/apps/files tests/apps/tasks tests/apps/prepared tests/apps/workers; do
            name=$(basename "$app")
            runner="$BUILD/$name/runner$EXE"
            mkdir -p "$BUILD/$name"
            echo "== $app"
            roc build --opt=dev --target="$TARGET" "$app/main.roc" --output="$runner" || { failed=1; continue; }
            "$runner" "$app"/specs/*.scm > "$BUILD/$name/results.jsonl" || failed=1
            grep -v '"status":"passed"' "$BUILD/$name/results.jsonl" || true
          done
          echo "== a crash's fault class crosses from its child exactly"
          sed 's/failed Lost(AppCrash)/failed Lost(Contract)/' tests/apps/tasks/specs/crash.scm > "$BUILD/broken-crash.scm"
          if "$BUILD/tasks/runner$EXE" "$BUILD/broken-crash.scm" > "$BUILD/broken.jsonl"; then
            echo "the runner passed a spec expecting the wrong fault class"; failed=1
          fi
          grep -q 'Lost(AppCrash)' "$BUILD/broken.jsonl" || { echo "the broken spec failed for another reason:"; cat "$BUILD/broken.jsonl"; failed=1; }
          echo "== a job that never finishes is ended at the runner's bound"
          printf '%s\n' '(test "Bound: a job that never finishes"' '  (steps' '    (fill (label "Rounds") "100000000000000")' '    (click (role button :name "Spin"))' '    (run-effect 1)))' > "$BUILD/bound.scm"
          if "$BUILD/workers/runner$EXE" "$BUILD/bound.scm" > "$BUILD/bound.jsonl"; then
            echo "the runner passed a job past its bound"; failed=1
          fi
          grep -q 'did not finish within 30 s' "$BUILD/bound.jsonl" || { echo "the bound did not end the job:"; cat "$BUILD/bound.jsonl"; failed=1; }
          exit $failed
      # The signals.roc tool as an author on this system runs it: the
      # checkout's package (cli/, whose Bundle.roc reads the runtime and the
      # scaffold from the working tree) in place of a release's, and an app
      # beside platform/, so the platform path init writes resolves to the
      # working tree's platform and the link inputs above. init, test (and a
      # spec that must fail), build, and serve answering with the right
      # content types.
      - name: CLI end to end
        env:
          EXE: ${{ matrix.exe }}
          ROC_NIGHTLY: ${{ needs.nightly.outputs.tag }}
        run: |
          # Restore on the first nightly that fixes roc-lang/roc#12977.
          # New nightlies retry automatically; native specs above still run.
          if [ "$RUNNER_OS" = Windows ] && [ "$ROC_NIGHTLY" = nightly-2026-11-11-7679cc5 ]; then
            echo "::notice::SKIP Windows CLI end to end: basic-cli Locale quoted values overflow during compile-time evaluation (https://github.com/roc-lang/roc/issues/12977); remove this workaround when fixed."
            exit 0
          fi
          failed=0
          root=$(pwd -W 2>/dev/null || pwd)
          cli_url=$(sed -n 's/.*cli: platform "\(.*\)",/\1/p' cli/main.roc)
          printf '%s\n' 'app [main!] {' "	cli: platform \"$cli_url\"," "	signals: \"$root/cli/main.roc\"," '}' '' 'import signals.Signals' '' 'main! = |args| Signals.run!(args)' > signals.roc
          echo "== init"
          roc signals.roc init tool-app || exit 1
          cd tool-app
          echo "== test"
          roc signals.roc test || failed=1
          sed 's/"2")/"3")/' specs/counter.scm > specs/wrong.scm
          if roc signals.roc test > ../wrong.txt; then echo "test passed a failing spec"; failed=1; fi
          cat ../wrong.txt
          grep -q 'Of 2 specs, 1 failed, 1 passed.' ../wrong.txt || failed=1
          rm specs/wrong.scm
          ls .signals/test/runner$EXE || failed=1
          echo "== build"
          roc signals.roc build || failed=1
          ls dist/index.html dist/assets/*/app.wasm dist/assets/*/runtime.mjs dist/assets/*/worker.mjs || failed=1
          echo "== serve"
          roc signals.roc serve --port 8123 > serve.txt 2>&1 &
          for i in $(seq 1 120); do curl -sf -o /dev/null http://127.0.0.1:8123/ && break; sleep 1; done
          cat serve.txt
          for f in "/ text/html" "/runtime.mjs text/javascript" "/app.wasm application/wasm"; do
            set -- $f
            type=$(curl -s -o /dev/null -w '%{content_type}' "http://127.0.0.1:8123$1")
            echo "$1: $type"
            case "$type" in "$2"*) ;; *) failed=1 ;; esac
          done
          curl -s http://127.0.0.1:8123/ | grep -q '__signals/events' || { echo "no reload script in the page"; failed=1; }
          exit $failed

  site:
    name: Site
    needs: nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@14a895879f6fea8c2d1a546a2a56c8502decb2a0
        with:
          cache: 'true'
          cache-workload: site
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.nightly.outputs.tag }}
      - run: blueprint run site
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Publishes the site the Site job built. Only main deploys: the
  # github-pages environment admits no other branch. The deploy waits for
  # Check, so a main that fails its gate is never published.
  deploy-site:
    name: Deploy site
    needs: [check, site]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
