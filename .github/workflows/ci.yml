name: CI

# Every Linux job runs a Blueprint task, so CI and contributors run the same
# commands: `blueprint run check` is the pull-request gate (the release dry
# run included), run here as Check (`check -- --without-fuzz
# --without-sizes`, in parts of `check -- --part K/N`), Fuzz smoke (every
# registered fuzz target's fixed examples, in shards of `fuzz-smoke`) and
# Site: `blueprint run site` builds the site, its API docs and its live
# examples, whose --opt=size modules it also reports by size for the gate. CI never runs a fuzz campaign: campaigns are a
# contributor's `blueprint run fuzz`. The macOS and Windows jobs run apps'
# specs with the spec runner `roc build` makes there, as an app author on
# that system does. A push to main also deploys that build to GitHub Pages,
# so the published site always matches main.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The latest Roc nightly, resolved once so every job of this run tests
  # with the same `roc` (roc-automation's model: the package compiler floats;
  # only the scripts' `roc-stable` is pinned in Blueprint.roc).
  nightly:
    name: Resolve the Roc nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.nightly.outputs.tag }}
    steps:
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

  # The pull-request gate, `check -- --without-fuzz --without-sizes`, as
  # parallel legs:
  # each runs part K of N, where K and N are this matrix's own job index
  # and size. Which stages each part runs, how the apps' per-app stages
  # (their builds, their specs in both runners, walks and broken specs)
  # are dealt among the parts (by need: an app a part's own stages use is
  # that part's, so no build is made by two legs), and every build each
  # part makes, is `CheckPlan` in the script, never this file:
  # `check -- --plan [--builds]` prints it. A part whose N is not the
  # plan's, or that would run nothing, fails; each part prints a SKIP line
  # for every stage another part runs. A leg compiles three apps at a time
  # (4 GiB per compiler process on a 16 GB runner). The legs pass
  # --without-sizes: the size report of the examples' --opt=size modules is
  # made by the Site job, which builds those modules to publish them, so
  # each is built once in a run; the Check result below needs it too.
  check-part:
    name: Check (part ${{ matrix.part }})
    needs: nightly
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@14a895879f6fea8c2d1a546a2a56c8502decb2a0
        with:
          cache: 'true'
          cache-workload: engine
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.nightly.outputs.tag }}
      - run: blueprint check
      # The fuzz targets are the Fuzz smoke job's; check prints a SKIP line
      # for each and accounts for every registered target.
      - env:
          GH_TOKEN: ${{ github.token }}
          INDEX: ${{ strategy.job-index }}
          TOTAL: ${{ strategy.job-total }}
        run: blueprint run check -- --without-fuzz --without-sizes --part "$((INDEX + 1))/$TOTAL"

  # One result for the whole matrix, the check a pull request requires:
  # it passes only when every part passed and the Site job, which makes
  # the gate's size report of the examples' shipping modules, passed.
  check:
    name: Check
    needs: [check-part, site]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          PARTS: ${{ needs.check-part.result }}
          SITE: ${{ needs.site.result }}
        run: |
          echo "check parts: $PARTS; site (the size report): $SITE"
          test "$PARTS" = success
          test "$SITE" = success

  # Every registered fuzz target's fixed examples (declared examples and
  # saved regressions) on a plain optimized build: each target compiles,
  # links and runs, and nothing explores. The targets come from the
  # registry (`Targets.fuzz_targets`), never from this file: each leg runs
  # shard K of N, where K and N are this matrix's own job index and size,
  # so a new target lands in some shard, and a leg whose shard would hold
  # no target fails. Each leg compiles one target at a time (16 GiB per
  # compiler process), so the legs are what run the compilers in parallel.
  fuzz-shard:
    name: Fuzz smoke (shard ${{ matrix.shard }})
    needs: nightly
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@14a895879f6fea8c2d1a546a2a56c8502decb2a0
        with:
          cache: 'true'
          cache-workload: engine
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.nightly.outputs.tag }}
      - env:
          INDEX: ${{ strategy.job-index }}
          TOTAL: ${{ strategy.job-total }}
        run: blueprint run fuzz-smoke -- --shard "$((INDEX + 1))/$TOTAL"
      # A failing target's build and check logs, roc-fuzz report and
      # validation are gone with the runner unless they are uploaded.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fuzz-smoke-${{ matrix.shard }}
          path: .build/fuzz-smoke/
          if-no-files-found: warn
          retention-days: 7

  # One result for the whole matrix, the check a pull request requires:
  # it passes only when every shard passed.
  fuzz:
    name: Fuzz smoke
    needs: fuzz-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULT: ${{ needs.fuzz-shard.result }}
        run: |
          echo "fuzz smoke shards: $RESULT"
          test "$RESULT" = success

  # The spec runner's link inputs for every system, cross-compiled on Linux
  # with the pinned Zig exactly as the release builds them.
  spec-inputs:
    name: Spec runner inputs
    needs: nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@14a895879f6fea8c2d1a546a2a56c8502decb2a0
        with:
          cache: 'true'
          cache-workload: engine
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.nightly.outputs.tag }}
      - run: blueprint run platform
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: spec-inputs
          path: platform/targets/
          if-no-files-found: error
          retention-days: 3

  # Building shows a system's link inputs are whole (`check` cross-links
  # them); only the system itself shows the runner works there. Each runner
  # builds a small app's and the worker apps' spec runners from those
  # inputs, as an app author on that system does, and runs their specs:
  # worker jobs in child processes, a crashing job, preparations, deadlines
  # and the file services. Then two specs that must fail: one expecting the
  # wrong fault class for a crash, and one whose job never finishes, which
  # the runner ends at its 30 s bound.
  native-specs:
    name: Specs on ${{ matrix.name }}
    needs: [nightly, spec-inputs]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-15, target: arm64mac, exe: '' }
          - { name: macOS (Intel), os: macos-15-intel, target: x64mac, exe: '' }
          - { name: Windows, os: windows-2025, target: x64win, exe: .exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@14a895879f6fea8c2d1a546a2a56c8502decb2a0
        with:
          cache: 'true'
          cache-workload: engine
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: spec-inputs
          path: platform/targets
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.nightly.outputs.tag }}
      - env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
          BUILD: .build/native
        run: |
          failed=0
          for app in examples/form-builder tests/apps/files tests/apps/tasks tests/apps/prepared tests/apps/workers; do
            name=$(basename "$app")
            runner="$BUILD/$name/runner$EXE"
            mkdir -p "$BUILD/$name"
            echo "== $app"
            roc build --opt=dev --target="$TARGET" "$app/main.roc" --output="$runner" || { failed=1; continue; }
            "$runner" "$app"/specs/*.scm > "$BUILD/$name/results.jsonl" || failed=1
            grep -v '"status":"passed"' "$BUILD/$name/results.jsonl" || true
          done
          echo "== a crash's fault class crosses from its child exactly"
          sed 's/failed Lost(AppCrash)/failed Lost(Contract)/' tests/apps/tasks/specs/crash.scm > "$BUILD/broken-crash.scm"
          if "$BUILD/tasks/runner$EXE" "$BUILD/broken-crash.scm" > "$BUILD/broken.jsonl"; then
            echo "the runner passed a spec expecting the wrong fault class"; failed=1
          fi
          grep -q 'Lost(AppCrash)' "$BUILD/broken.jsonl" || { echo "the broken spec failed for another reason:"; cat "$BUILD/broken.jsonl"; failed=1; }
          echo "== a job that never finishes is ended at the runner's bound"
          printf '%s\n' '(test "Bound: a job that never finishes"' '  (steps' '    (fill (label "Rounds") "100000000000000")' '    (click (role button :name "Spin"))' '    (run-effect 1)))' > "$BUILD/bound.scm"
          if "$BUILD/workers/runner$EXE" "$BUILD/bound.scm" > "$BUILD/bound.jsonl"; then
            echo "the runner passed a job past its bound"; failed=1
          fi
          grep -q 'did not finish within 30 s' "$BUILD/bound.jsonl" || { echo "the bound did not end the job:"; cat "$BUILD/bound.jsonl"; failed=1; }
          exit $failed
      # The signals.roc tool as an author on this system runs it: the
      # checkout's package (cli/, whose Bundle.roc reads the runtime and the
      # scaffold from the working tree) in place of a release's, and an app
      # beside platform/, so the platform path init writes resolves to the
      # working tree's platform and the link inputs above. init, test (and a
      # spec that must fail), build, and serve answering with the right
      # content types.
      - name: CLI end to end
        env:
          EXE: ${{ matrix.exe }}
          ROC_NIGHTLY: ${{ needs.nightly.outputs.tag }}
        run: |
          failed=0
          root=$(pwd -W 2>/dev/null || pwd)
          cli_url=$(sed -n 's/.*cli: platform "\(.*\)",/\1/p' cli/main.roc)
          printf '%s\n' 'app [main!] {' "	cli: platform \"$cli_url\"," "	signals: \"$root/cli/main.roc\"," '}' '' 'import signals.Signals' '' 'main! = |args| Signals.run!(args)' > signals.roc
          echo "== init ($cli_url, $ROC_NIGHTLY)"
          roc signals.roc init tool-app || exit 1
          cd tool-app
          echo "== test"
          roc signals.roc test || failed=1
          sed 's/"2")/"3")/' specs/counter.scm > specs/wrong.scm
          if roc signals.roc test > ../wrong.txt; then echo "test passed a failing spec"; failed=1; fi
          cat ../wrong.txt
          grep -q 'Of 2 specs, 1 failed, 1 passed.' ../wrong.txt || failed=1
          rm specs/wrong.scm
          ls .signals/test/runner$EXE || failed=1
          echo "== build"
          roc signals.roc build || failed=1
          ls dist/index.html dist/assets/*/app.wasm dist/assets/*/runtime.mjs dist/assets/*/worker.mjs dist/assets/*/environment.mjs || failed=1
          echo "== serve"
          roc signals.roc serve --port 8123 > serve.txt 2>&1 &
          for i in $(seq 1 120); do curl -sf -o /dev/null http://127.0.0.1:8123/ && break; sleep 1; done
          cat serve.txt
          for f in "/ text/html" "/runtime.mjs text/javascript" "/environment.mjs text/javascript" "/app.wasm application/wasm"; do
            set -- $f
            type=$(curl -s -o /dev/null -w '%{content_type}' "http://127.0.0.1:8123$1")
            echo "$1: $type"
            case "$type" in "$2"*) ;; *) failed=1 ;; esac
          done
          curl -s http://127.0.0.1:8123/ | grep -q '__signals/events' || { echo "no reload script in the page"; failed=1; }
          exit $failed

  site:
    name: Site
    needs: nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@14a895879f6fea8c2d1a546a2a56c8502decb2a0
        with:
          cache: 'true'
          cache-workload: site
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.nightly.outputs.tag }}
      - run: blueprint run site
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Publishes the site the Site job built. Only main deploys: the
  # github-pages environment admits no other branch. The deploy waits for
  # Check and Fuzz smoke, so a main that fails its gate is never published.
  deploy-site:
    name: Deploy site
    needs: [check, fuzz, site]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
