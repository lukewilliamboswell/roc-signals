name: CI

# Runner intent and build modes: www/content/docs/contributing.md#ci-intent-and-runner-matrix

on:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: Validate a compiler candidate without publication or deployment
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.select.outputs.source }}
      gui: ${{ steps.select.outputs.gui }}
      site: ${{ steps.select.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 scripts/minici selection
      - id: select
        run: python3 scripts/ci_changes.py

  source:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    name: Hosted source tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Install Wasm stack instrumentation
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '23.9.0'
      - run: python3 scripts/minici hosted

  gui:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    name: Native GUI build and specs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GUI_HOST_LOCK: gui-host.lock.json
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Install the GUI host Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Install GUI runtime dependencies
        run: |
          sudo apt-get update
          # The development packages are needed whenever this job builds the host
          # itself, which it does when the lock predates a host change.
          sudo apt-get install -y libfreetype6 libxkbcommon0 libxkbcommon-x11-0 \
            libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: gui-dev
          cache-workspace-crates: false
          cache-bin: false
          env-vars: ImageVersion CC CXX CFLAGS CXXFLAGS LDFLAGS SDKROOT MACOSX_DEPLOYMENT_TARGET GPUI_FXC_PATH DEVELOPER_DIR TOOLCHAINS
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Verify GUI discovery and applications
        run: python3 scripts/minici gui
      - name: Open GUI examples with software Vulkan
        run: |
          sudo apt-get install -y weston xvfb xauth mesa-vulkan-drivers
          python3 scripts/minici gui-smoke
      - name: Drive the scripted GUI scenarios
        run: python3 scripts/minici gui-scenarios
      - name: Keep the scenario reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gui-scenario-reports
          path: .test-out/gui-scenarios
          if-no-files-found: ignore

  gui-windows:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    name: Native GUI build and specs (Windows)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      GUI_HOST_LOCK: gui-host.lock.json
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-toolchain
      - name: Install the Windows host Rust target
        shell: bash
        run: |
          # Only needed when this job builds the host, but installing it
          # unconditionally keeps the two paths from diverging silently.
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 x86_64-pc-windows-gnullvm
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: gui-dev
          cache-workspace-crates: false
          cache-bin: false
          env-vars: ImageVersion CC CXX CFLAGS CXXFLAGS LDFLAGS SDKROOT MACOSX_DEPLOYMENT_TARGET GPUI_FXC_PATH DEVELOPER_DIR TOOLCHAINS
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Verify GUI discovery and applications
        run: python scripts/minici gui

  gui-macos:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    name: Native GUI build and specs (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GUI_HOST_LOCK: gui-host.lock.json
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Install the GUI host Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: gui-dev
          cache-workspace-crates: false
          cache-bin: false
          env-vars: ImageVersion CC CXX CFLAGS CXXFLAGS LDFLAGS SDKROOT MACOSX_DEPLOYMENT_TARGET GPUI_FXC_PATH DEVELOPER_DIR TOOLCHAINS
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Verify GUI applications with separate archives
        run: python3 scripts/minici gui

  platform-source:
    name: Platform source
    needs: [changes, source, gui, gui-windows, gui-macos, site]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require every selected job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_changes.py --verify-results

  site:
    name: Documentation and site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Zola
        run: |
          curl -fsSL https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/zola.tar.gz"
          echo "0ca09aa40376aaa9ddfb512ff9ad963262ef95edb0d0f2d5ec6961b6f5cf22ef  $RUNNER_TEMP/zola.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/zola.tar.gz" -C "$RUNNER_TEMP"
      - name: Check documentation and templates
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          python3 scripts/minici site
