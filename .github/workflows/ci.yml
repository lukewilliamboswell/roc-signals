name: CI

# Runner intent and build modes: www/content/docs/contributing.md#ci-intent-and-runner-matrix

on:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: Validate a compiler candidate without publication or deployment
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.select.outputs.source }}
      site: ${{ steps.select.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7aff4132691ad4fc348abe9df146a57512b49bd6
      - run: blueprint run selection
      - id: select
        run: blueprint run ci-changes

  source:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    name: Hosted source tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7aff4132691ad4fc348abe9df146a57512b49bd6
        with:
          cache: 'true'
          cache-workload: dev
      - uses: ./.github/actions/setup-roc
      - run: blueprint run hosted

  platform-source:
    name: Platform source
    needs: [changes, source, site]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require every selected job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_changes.py --verify-results

  site:
    name: Documentation and site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7aff4132691ad4fc348abe9df146a57512b49bd6
      - name: Check documentation and templates
        run: blueprint run site
