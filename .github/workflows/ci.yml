name: CI

on:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: Validate a compiler candidate without publication or deployment
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  attestations: read

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-24.04
    outputs:
      smoke: ${{ steps.select.outputs.smoke }}
      source: ${{ steps.select.outputs.source }}
      gui: ${{ steps.select.outputs.gui }}
      published: ${{ steps.select.outputs.published }}
      archive: ${{ steps.select.outputs.archive }}
      site: ${{ steps.select.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m unittest discover -s scripts -p test_ci_changes.py
      - id: select
        run: python3 scripts/ci_changes.py

  smoke:
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    name: PR normal and smoke tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify shared platform sources
        run: |
          python3 scripts/prepare_platforms.py
          python3 scripts/prepare_platforms.py --check
          python3 -m unittest discover -s scripts -p 'test_prepare_platforms.py'
      - uses: ./.github/actions/setup-toolchain
      - run: python3 scripts/test.py zig browser roc-check roc-test wasm size --native never --bundle never
      - run: python3 scripts/fuzz.py check

  source:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    name: Full tests and coverage
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify shared platform sources
        run: |
          python3 scripts/prepare_platforms.py
          python3 scripts/prepare_platforms.py --check
          python3 -m unittest discover -s scripts -p 'test_prepare_platforms.py'
      - uses: ./.github/actions/setup-toolchain
      - run: brew install dwarfutils
      - run: python3 scripts/test.py
      - name: Native coverage
        run: |
          sudo env "PATH=$PATH" \
            "ZIG_GLOBAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-cache" \
            "ZIG_LOCAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-cache" \
            python3 scripts/coverage.py --min 86.5 \
              --min-file src/signals/engine.zig=71.0 \
              --min-file src/signals/descriptor_stream.zig=76.0 \
              --min-file src/native_host.zig=92.5 \
              --min-file src/signals/roc_platform_abi.zig=72.0 \
              --min-file src/spec/spec_parser.zig=90.0 --top 20
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-host-coverage
          path: kcov-output/native-host

  gui:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    name: Native GUI build and specs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Install GUI host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev
          rustup toolchain install 1.95.0 --profile minimal
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        with:
          shared-key: gui-dependencies
          cache-workspace-crates: false
          cache-bin: false
          env-vars: ImageVersion CC CXX CFLAGS CXXFLAGS LDFLAGS SDKROOT MACOSX_DEPLOYMENT_TARGET GPUI_FXC_PATH
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Verify GUI discovery and applications
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          python3 -m unittest discover -s scripts -p 'test_gui*.py'
          python3 scripts/test.py gui --keep-output
      - name: Open GUI examples with software Vulkan
        run: |
          sudo apt-get install -y weston xvfb xauth mesa-vulkan-drivers
          xvfb-run -a -s '-screen 0 1280x1024x24' python3 scripts/gui_smoke.py --wayland

  gui-windows:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    name: Native GUI build and specs (Windows)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-toolchain
      - name: Install GUI host build dependencies
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        with:
          shared-key: gui-dependencies
          cache-workspace-crates: false
          cache-bin: false
          env-vars: ImageVersion CC CXX CFLAGS CXXFLAGS LDFLAGS SDKROOT MACOSX_DEPLOYMENT_TARGET GPUI_FXC_PATH
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Verify GUI discovery and applications
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          python -m unittest discover -s scripts -p 'test_gui*.py'
          python scripts/test.py gui --keep-output
      # Distributable inputs are published with provenance by gui-hosts.yml on
      # their own release cycle; this job only proves the optimized build works.
      - name: Build the distributable Windows link inputs
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: python scripts/build_gui.py
      - name: Verify Windows dependency admission and bundle the built host
        run: |
          python -m unittest scripts/test_prepare_dependencies.py scripts/test_dependency_artifacts.py
          python scripts/bundle_platforms.py --package gui --no-build --output-dir "$env:RUNNER_TEMP/gui-candidate"

  gui-macos:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    name: Native GUI build and specs (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      TOOLCHAINS: Metal
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Install GUI host build dependencies
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          xcrun --find metal
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: gui-dependencies
          cache-workspace-crates: false
          cache-bin: false
          env-vars: ImageVersion CC CXX CFLAGS CXXFLAGS LDFLAGS SDKROOT MACOSX_DEPLOYMENT_TARGET TOOLCHAINS DEVELOPER_DIR
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Verify GUI applications with separate archives
        run: python3 scripts/test.py gui --keep-output

  platform-source:
    name: Platform source
    needs: [changes, smoke, source, gui, gui-windows, gui-macos, published, archive, site]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require every selected job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_changes.py --verify-results

  published:
    needs: changes
    if: needs.changes.outputs.published == 'true'
    name: Published examples
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify shared platform sources
        run: |
          python3 scripts/prepare_platforms.py
          python3 scripts/prepare_platforms.py --check
          python3 -m unittest discover -s scripts -p 'test_prepare_platforms.py'
      - uses: ./.github/actions/setup-toolchain
      - run: python3 scripts/test.py published

  archive:
    needs: changes
    if: needs.changes.outputs.archive == 'true'
    name: Release archive
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify shared platform sources
        run: |
          python3 scripts/prepare_platforms.py
          python3 scripts/prepare_platforms.py --check
          python3 -m unittest discover -s scripts -p 'test_prepare_platforms.py'
      - uses: ./.github/actions/setup-toolchain
      - run: python3 scripts/release.py prepare --version 0.2.0-rc1 --directory "$RUNNER_TEMP/candidate"
      - run: python3 scripts/release.py check --directory "$RUNNER_TEMP/candidate"

  site:
    name: Documentation and site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Zola
        run: |
          curl -fsSL https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/zola.tar.gz"
          echo "0ca09aa40376aaa9ddfb512ff9ad963262ef95edb0d0f2d5ec6961b6f5cf22ef  $RUNNER_TEMP/zola.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/zola.tar.gz" -C "$RUNNER_TEMP"
      - name: Check documentation and templates
        run: '"$RUNNER_TEMP/zola" --root www check'
