name: CI

on:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: Validate a compiler candidate without publication or deployment
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: PR normal and smoke tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify shared platform sources
        run: |
          python3 scripts/prepare_platforms.py
          python3 scripts/prepare_platforms.py --check
          python3 -m unittest discover -s scripts -p 'test_prepare_platforms.py'
      - uses: ./.github/actions/setup-toolchain
      - run: python3 scripts/test.py zig browser roc-check roc-test wasm size --native never --bundle never
      - run: python3 scripts/fuzz.py check

  source:
    name: Full tests and coverage
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify shared platform sources
        run: |
          python3 scripts/prepare_platforms.py
          python3 scripts/prepare_platforms.py --check
          python3 -m unittest discover -s scripts -p 'test_prepare_platforms.py'
      - uses: ./.github/actions/setup-toolchain
      - run: brew install dwarfutils
      - run: python3 scripts/test.py
      - name: Native coverage
        run: |
          sudo env "PATH=$PATH" \
            "ZIG_GLOBAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-cache" \
            "ZIG_LOCAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-cache" \
            python3 scripts/coverage.py --min 86.5 \
              --min-file src/signals/engine.zig=71.0 \
              --min-file src/signals/descriptor_stream.zig=76.0 \
              --min-file src/native_host.zig=92.5 \
              --min-file src/signals/roc_platform_abi.zig=72.0 \
              --min-file src/spec/spec_parser.zig=90.0 --top 20
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-host-coverage
          path: kcov-output/native-host

  gui:
    name: Native GUI build and specs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Install GUI host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev
          rustup toolchain install 1.95.0 --profile minimal
      - name: Verify GUI discovery and applications
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          python3 -m unittest discover -s scripts -p 'test_gui_suite.py'
          python3 scripts/test.py gui --keep-output

  gui-windows:
    name: Native GUI build and specs (Windows)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-toolchain
      - name: Install GUI host build dependencies
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Verify GUI discovery and applications
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          python -m unittest discover -s scripts -p 'test_gui_suite.py'
          python scripts/test.py gui --keep-output
      # Distributable inputs are published with provenance by gui-hosts.yml on
      # their own release cycle; this job only proves the optimized build works.
      - name: Build the distributable Windows link inputs
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: python scripts/build_gui.py

  platform-source:
    name: Platform source
    needs: [smoke, source, gui, gui-windows]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every source job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json,os; assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values())'

  published:
    name: Published examples
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify shared platform sources
        run: |
          python3 scripts/prepare_platforms.py
          python3 scripts/prepare_platforms.py --check
          python3 -m unittest discover -s scripts -p 'test_prepare_platforms.py'
      - uses: ./.github/actions/setup-toolchain
      - run: python3 scripts/test.py published

  archive:
    name: Release archive
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify shared platform sources
        run: |
          python3 scripts/prepare_platforms.py
          python3 scripts/prepare_platforms.py --check
          python3 -m unittest discover -s scripts -p 'test_prepare_platforms.py'
      - uses: ./.github/actions/setup-toolchain
      - run: python3 scripts/release.py prepare --version 0.2.0-rc1 --directory "$RUNNER_TEMP/candidate"
      - run: python3 scripts/release.py check --directory "$RUNNER_TEMP/candidate"
