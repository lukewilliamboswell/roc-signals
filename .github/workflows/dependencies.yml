name: Dependency releases

on:
  pull_request:
    paths:
      - dependencies/musl.json
      - scripts/build_musl.py
      - scripts/dependency_archive.py
      - scripts/dependency_artifacts.py
      - scripts/release_dependencies.py
      - scripts/test_dependency_artifacts.py
      - scripts/test_musl_artifact.py
      - test/dependencies/musl.c
      - .github/workflows/dependencies.yml
      - Blueprint.roc
      - Blueprint.lock
  workflow_dispatch:
    inputs:
      release_tag:
        description: New independent dependency release tag (deps-musl-<version>)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test musl (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x64musl
          - os: ubuntu-24.04-arm
            target: arm64musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7aff4132691ad4fc348abe9df146a57512b49bd6
        with:
          cache: 'true'
          cache-workload: musl
      - name: Check dependency admission failures
        run: blueprint run unittest -- scripts/test_dependency_artifacts.py
      - name: Build from pinned upstream source
        run: blueprint run build-musl -- --target '${{ matrix.target }}' --output '${{ runner.temp }}/dependencies'
      - name: Test the exact archive on its native architecture
        run: blueprint run test-musl -- '${{ runner.temp }}/dependencies/musl-${{ matrix.target }}.tar' --target '${{ matrix.target }}'
      - name: Check reproducibility in a second build directory
        run: |
          blueprint run build-musl -- --target '${{ matrix.target }}' --output '${{ runner.temp }}/rebuild'
          cmp '${{ runner.temp }}/dependencies/musl-${{ matrix.target }}.tar' '${{ runner.temp }}/rebuild/musl-${{ matrix.target }}.tar'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: musl-${{ matrix.target }}
          path: ${{ runner.temp }}/dependencies/*.tar
          retention-days: 30

  publish:
    name: Attest tested dependency artifacts
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: musl-*
          merge-multiple: true
          path: ${{ runner.temp }}/dependencies
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/dependencies/*.tar
      - name: Publish the tested bytes without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/release_dependencies.py --directory "$RUNNER_TEMP/dependencies" --tag "$RELEASE_TAG"
