# Fuzzing campaigns.
#
# `check` on every pull request replays each target's declared examples and
# saved regressions, which is fast but finds nothing new by construction.
# Finding new inputs needs a campaign, which is too slow and too variable to
# gate a pull request on, so it runs here on a schedule or on dispatch and
# reports what it found. The corpora live in the Actions cache between runs.
name: Fuzz

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds of exploration per target"
        default: "600"
      targets:
        description: "Space-separated target names; empty for every target"
        default: ""
  schedule:
    # Nightly, away from the hour so it does not queue behind everything else
    # scheduled on the hour.
    - cron: "37 4 * * *"

permissions:
  contents: read

jobs:
  campaign:
    name: Fuzz campaign
    runs-on: ubuntu-24.04
    # Eleven targets at the default 600 s, plus builds, with room for a
    # longer dispatched campaign.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7aff4132691ad4fc348abe9df146a57512b49bd6
        with:
          cache: 'true'
          cache-workload: engine
      - name: Restore corpora
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fuzz-out/*/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz
        env:
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '600' }}
          TARGETS: ${{ github.event.inputs.targets || '' }}
        run: blueprint run fuzz -- --time "$SECONDS_PER_TARGET" $TARGETS
      - name: Save corpora
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fuzz-out/*/corpus
          key: fuzz-corpus-${{ github.run_id }}
      # The findings are the product of the run, and they are gone with the
      # runner unless they are uploaded.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-reports
          path: .fuzz-out/*/report/
          include-hidden-files: true
          if-no-files-found: warn
