# Scheduled fuzzing campaigns.
#
# The pull-request job in ci.yml only replays the committed regression corpus,
# which is fast but finds nothing new by construction. Finding new inputs needs
# a campaign, and a campaign is too slow and too variable to gate a pull request
# on, so it runs here on a schedule and reports what it found.
name: Fuzz

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Total budget across the targets, split by weight, e.g. 1h, 3h"
        default: "2h"
      targets:
        description: "Target names, or 'all'"
        default: "all"
  schedule:
    # Nightly, well away from the hour so it does not queue behind everything
    # else scheduled on the hour.
    - cron: "37 4 * * *"

permissions:
  contents: read

jobs:
  campaign:
    name: Fuzz ${{ github.event.inputs.targets || 'all' }}
    runs-on: ubuntu-24.04
    # The default 2h campaign, plus builds, with room for the dispatch input to
    # ask for longer without the job being killed mid-run.
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false

      - name: Install AFL++
        run: |
          sudo apt-get update
          sudo apt-get install -y afl++

      # AFL++ refuses to start when the CPU governor looks wrong or a core-dump
      # handler is installed, neither of which is under our control on a runner.
      - name: Configure the system for AFL++
        run: sudo afl-system-config || true

      # `campaign` splits one budget by weight rather than giving each target
      # the same time, since the subsystem targets saturate in minutes and the
      # full-engine `structural` target needs hours; see scripts/fuzz.py.
      - name: Fuzz
        run: |
          python3 scripts/fuzz.py campaign ${{ github.event.inputs.targets || 'all' }} \
            --time "${{ github.event.inputs.duration || '2h' }}" \
            -j 2

      - name: Report
        if: always()
        run: python3 scripts/fuzz.py status

      # The crashing inputs are the whole product of the run, and they are gone
      # with the runner unless they are uploaded. Corpora go too: they are the
      # cheapest way to give the next campaign a running start.
      - name: Upload crashes and corpora
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: |
            .fuzz-out/*/out/*/crashes/
            .fuzz-out/*/out/*/queue/
            .fuzz-out/*/afl-*.log
          include-hidden-files: true
          if-no-files-found: error
