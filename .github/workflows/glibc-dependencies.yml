name: glibc dependency releases

on:
  pull_request:
    paths:
      - dependencies/glibc.json
      - dependencies/glibc/Dockerfile
      - dependencies/glibc/COPYING.LIB
      - scripts/build_glibc.py
      - scripts/test_glibc_dependencies.py
      - scripts/dependency_archive.py
      - scripts/dependency_artifacts.py
      - scripts/test_dependency_artifacts.py
      - scripts/release_dependencies.py
      - test/dependencies/glibc.c
      - .github/workflows/glibc-dependencies.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: New independent glibc release tag (deps-glibc-<version>)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: glibc-dependencies-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test glibc
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check source admission and publication failures
        run: python3 -m unittest scripts/test_dependency_artifacts.py scripts/test_glibc_dependencies.py
      - name: Build from verified source and test the extracted candidate
        run: python3 scripts/build_glibc.py --output "$RUNNER_TEMP/dependencies"
      - name: Check reproducibility in another clean container
        run: |
          python3 scripts/build_glibc.py --output "$RUNNER_TEMP/rebuild"
          cmp "$RUNNER_TEMP/dependencies/glibc-x64glibc.tar" "$RUNNER_TEMP/rebuild/glibc-x64glibc.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: glibc-x64glibc
          path: ${{ runner.temp }}/dependencies/*.tar
          retention-days: 30

  publish:
    name: Attest tested dependency artifacts
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: glibc-*
          merge-multiple: true
          path: ${{ runner.temp }}/dependencies
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/dependencies/*.tar
      - name: Publish the tested bytes without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/release_dependencies.py --directory "$RUNNER_TEMP/dependencies" --tag "$RELEASE_TAG" --kind glibc
