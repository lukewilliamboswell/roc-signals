name: GUI host link inputs

# Publishes host-owned archives after native tests of the extracted candidates.
# External dependency inputs have their own release and verification policies.

# Runner intent and build modes: www/content/docs/contributing.md#ci-intent-and-runner-matrix

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: New independent host release tag (deps-gui-host-<version>)
        type: string
        required: true

      release_targets:
        description: Native host targets to publish
        type: choice
        default: x64glibc
        options:
          - x64glibc
          - x64mingw
          - arm64mac
          - x64glibc,x64mingw
          - all

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: gui-hosts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build link inputs (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Release validation builds only the selected native targets.
        include: >-
          ${{ fromJSON(inputs.release_targets == 'x64glibc'
            && '[{"os":"ubuntu-24.04","target":"x64glibc"}]'
            || inputs.release_targets == 'arm64mac'
            && '[{"os":"macos-15","target":"arm64mac"}]'
            || inputs.release_targets == 'x64mingw'
            && '[{"os":"windows-2025","target":"x64mingw"}]'
            || inputs.release_targets == 'all'
            && '[{"os":"ubuntu-24.04","target":"x64glibc"},{"os":"windows-2025","target":"x64mingw"},{"os":"macos-15","target":"arm64mac"}]'
            || '[{"os":"ubuntu-24.04","target":"x64glibc"},{"os":"windows-2025","target":"x64mingw"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-toolchain
      - name: Check host archive admission
        run: |
          python -m unittest discover -s scripts -p test_host_notice_payload.py
          python -m unittest discover -s scripts -p test_host_build_identity.py
          python -m unittest discover -s scripts -p test_gui_host_artifacts.py
          python -m unittest discover -s scripts -p test_rust_license_inventory.py
          python -m unittest discover -s scripts -p test_toolchain_license_inventory.py
      - name: Install GUI host build dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev
          fi
          rustup toolchain install 1.95.0 --profile minimal
          if [ "$RUNNER_OS" = Windows ]; then
            rustup target add --toolchain 1.95.0 x86_64-pc-windows-gnullvm
          fi
      - name: Verify FreeType build-script suppression
        if: runner.os == 'Linux'
        env:
          SIGNALS_TEST_CARGO_BOUNDARY: '1'
        run: python3 -m unittest discover -s scripts -p test_freetype_boundary.py
      - name: Install the selected macOS Metal toolchain
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
          TOOLCHAINS: Metal
        run: |
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "TOOLCHAINS=Metal" >> "$GITHUB_ENV"
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        with:
          shared-key: gui-dependencies
          cache-workspace-crates: false
          cache-bin: false
          env-vars: ImageVersion CC CXX CFLAGS CXXFLAGS LDFLAGS SDKROOT MACOSX_DEPLOYMENT_TARGET GPUI_FXC_PATH DEVELOPER_DIR TOOLCHAINS
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the optimized host and its link inputs
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        shell: bash
        run: |
          python scripts/prepare_platforms.py
          python scripts/build_gui.py --cargo-evidence "$RUNNER_TEMP/cargo-evidence"
          python scripts/prepare_gui_host_release.py --target "${{ matrix.target }}" --cargo-evidence "$RUNNER_TEMP/cargo-evidence" --output host-candidate --roc roc
      - name: Audit Windows archive dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m unittest discover -s scripts -p 'test_windows_archive_audit.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/windows-import-audit"
          python scripts/audit_windows_archive.py platform-gui/targets/x64mingw/libsignals_gpui_host.a > "$env:RUNNER_TEMP/windows-import-audit/host.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/audit_windows_archive.py platform-gui/targets/x64mingw/libengine.a > "$env:RUNNER_TEMP/windows-import-audit/engine.json"
      - name: Upload Windows dependency review evidence
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-import-audit
          path: ${{ runner.temp }}/windows-import-audit
          if-no-files-found: error
      - name: Inventory the macOS archives' external references
        # A failed application link names only the first twenty missing
        # symbols; the full inventory says what the interface catalog lacks.
        if: failure() && runner.os == 'macOS'
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          rustup component add llvm-tools-preview
          mkdir -p "$RUNNER_TEMP/macos-link-audit"
          python scripts/audit_macos_archive.py platform-gui/targets/${{ matrix.target }}/libsignals_gpui_host.a platform-gui/targets/${{ matrix.target }}/libengine.a --output "$RUNNER_TEMP/macos-link-audit/inventory.json"
      - name: Upload the macOS link audit
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-link-audit
          path: ${{ runner.temp }}/macos-link-audit
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gui-host-${{ matrix.target }}
          path: host-candidate/
          retention-days: 30

  publish:
    name: Attest and release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'lukewilliamboswell/roc-signals'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: gui-host-*
          merge-multiple: true
          path: ${{ runner.temp }}/candidates
      - name: Select the exact tested host and source pairs
        env:
          RELEASE_TARGETS: ${{ inputs.release_targets }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, shutil
          targets = (["x64glibc", "x64mingw", "arm64mac"] if os.environ["RELEASE_TARGETS"] == "all"
                     else os.environ["RELEASE_TARGETS"].split(","))
          assert targets and len(set(targets)) == len(targets) and set(targets) <= {"x64glibc", "x64mingw", "arm64mac"}
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          output = root / "link-inputs"
          output.mkdir()
          for target in targets:
              for kind in ("gui-host", "gui-host-sources"):
                  source = root / "candidates" / f"{kind}-{target}.tar"
                  shutil.copyfile(source, output / source.name)
          PYTHON
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/link-inputs/*.tar
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TARGETS: ${{ inputs.release_targets }}
        run: |
          if [ "$RELEASE_TARGETS" = all ]; then
            targets=(x64glibc x64mingw arm64mac)
          else
            IFS=',' read -ra targets <<< "$RELEASE_TARGETS"
          fi
          arguments=()
          for target in "${targets[@]}"; do arguments+=(--target "$target"); done
          python3 scripts/release_gui_hosts.py --directory "$RUNNER_TEMP/link-inputs" --tag "$RELEASE_TAG" "${arguments[@]}"
