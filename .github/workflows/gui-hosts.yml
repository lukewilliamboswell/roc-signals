name: GUI host link inputs

# Publishes host-owned archives after native tests of the extracted candidates.
# External dependency inputs have their own release and verification policies.

on:
  pull_request:
    paths:
      - .github/workflows/gui-hosts.yml
      - scripts/build_gui.py
      - scripts/build_macos_stubs.py
      - scripts/check_macos_interfaces.py
      - scripts/bundle_platforms.py
      - scripts/test_macos_stubs.py
      - dependencies/macos-interfaces/**
      - .cargo/config.toml
      - scripts/test_freetype_boundary.py
      - scripts/cargo_build_evidence.py
      - scripts/host_build_identity.py
      - scripts/test_host_build_identity.py
      - scripts/host_notice_payload.py
      - scripts/prepare_gui_host_release.py
      - scripts/test_host_notice_payload.py
      - scripts/gui_host_artifacts.py
      - scripts/test_gui_host_artifacts.py
      - scripts/rust_license_inventory.py
      - scripts/test_rust_license_inventory.py
      - scripts/toolchain_license_inventory.py
      - scripts/test_toolchain_license_inventory.py
      - dependencies/gui-host-notices/**
      - scripts/release_dependencies.py
      - scripts/release_gui_hosts.py
      - scripts/dependency_artifacts.py
      - scripts/dependency_archive.py
  workflow_dispatch:
    inputs:
      release_tag:
        description: New independent host release tag (deps-gui-host-<version>)
        type: string
        required: true

      release_targets:
        description: Eligible host targets to publish (macOS remains candidate-only)
        type: choice
        default: x64glibc
        options:
          - x64glibc
          - x64win
          - x64glibc,x64win

permissions:
  contents: read
  attestations: read

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: gui-hosts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build link inputs (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # PRs validate all native hosts; a release builds only its selected targets.
        include: >-
          ${{ fromJSON(github.event_name != 'workflow_dispatch'
            && '[{"os":"windows-2025","target":"x64win"},{"os":"ubuntu-24.04","target":"x64glibc"},{"os":"macos-15","target":"arm64mac"}]'
            || inputs.release_targets == 'x64glibc'
            && '[{"os":"ubuntu-24.04","target":"x64glibc"}]'
            || inputs.release_targets == 'x64win'
            && '[{"os":"windows-2025","target":"x64win"}]'
            || '[{"os":"ubuntu-24.04","target":"x64glibc"},{"os":"windows-2025","target":"x64win"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-toolchain
      - name: Check host archive admission
        run: |
          python -m unittest discover -s scripts -p test_host_notice_payload.py
          python -m unittest discover -s scripts -p test_host_build_identity.py
          python -m unittest discover -s scripts -p test_gui_host_artifacts.py
          python -m unittest discover -s scripts -p test_rust_license_inventory.py
          python -m unittest discover -s scripts -p test_toolchain_license_inventory.py
      - name: Install GUI host build dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev
          fi
          rustup toolchain install 1.95.0 --profile minimal
      - name: Verify FreeType build-script suppression
        if: runner.os == 'Linux'
        env:
          SIGNALS_TEST_CARGO_BOUNDARY: '1'
        run: python3 -m unittest discover -s scripts -p test_freetype_boundary.py
      - name: Install the selected macOS Metal toolchain
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
          TOOLCHAINS: Metal
        run: |
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "TOOLCHAINS=Metal" >> "$GITHUB_ENV"
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        with:
          shared-key: gui-dependencies
          cache-workspace-crates: false
          cache-bin: false
          env-vars: ImageVersion CC CXX CFLAGS CXXFLAGS LDFLAGS SDKROOT MACOSX_DEPLOYMENT_TARGET GPUI_FXC_PATH DEVELOPER_DIR TOOLCHAINS
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Build the optimized host and its link inputs
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        shell: bash
        run: |
          python scripts/prepare_platforms.py
          if [ "${{ matrix.target }}" = arm64mac ]; then
            python scripts/build_gui.py --cargo-evidence "$RUNNER_TEMP/cargo-evidence"
            mkdir host-candidate
            python scripts/gui_host_artifacts.py --target arm64mac --output host-candidate/gui-host-arm64mac.tar --roc roc
            cp -R "$RUNNER_TEMP/cargo-evidence" host-candidate/cargo-evidence
          else
            python scripts/build_gui.py --cargo-evidence "$RUNNER_TEMP/cargo-evidence"
            python scripts/prepare_gui_host_release.py --target "${{ matrix.target }}" --cargo-evidence "$RUNNER_TEMP/cargo-evidence" --output host-candidate --roc roc
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gui-host-${{ matrix.target }}
          path: host-candidate/
          retention-days: 30

  publish:
    name: Attest and release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'lukewilliamboswell/roc-signals'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: gui-host-*
          merge-multiple: true
          path: ${{ runner.temp }}/candidates
      - name: Select the exact tested host and source pairs
        env:
          RELEASE_TARGETS: ${{ inputs.release_targets }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, shutil
          targets = os.environ["RELEASE_TARGETS"].split(",")
          assert targets and len(set(targets)) == len(targets) and set(targets) <= {"x64glibc", "x64win"}
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          output = root / "link-inputs"
          output.mkdir()
          for target in targets:
              for kind in ("gui-host", "gui-host-sources"):
                  source = root / "candidates" / f"{kind}-{target}.tar"
                  shutil.copyfile(source, output / source.name)
          PYTHON
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/link-inputs/*.tar
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TARGETS: ${{ inputs.release_targets }}
        run: |
          IFS=',' read -ra targets <<< "$RELEASE_TARGETS"
          arguments=()
          for target in "${targets[@]}"; do arguments+=(--target "$target"); done
          python3 scripts/release_gui_hosts.py --directory "$RUNNER_TEMP/link-inputs" --tag "$RELEASE_TAG" "${arguments[@]}"
