name: GUI host link inputs

# Publishes host-owned archives after native tests of the extracted candidates.
# External dependency inputs have their own release and verification policies.

on:
  pull_request:
    paths:
      - .github/workflows/gui-hosts.yml
      - scripts/gui_host_artifacts.py
      - scripts/test_gui_host_artifacts.py
      - scripts/rust_license_inventory.py
      - scripts/test_rust_license_inventory.py
      - dependencies/gui-host-notices/**
      - scripts/release_dependencies.py
      - scripts/dependency_artifacts.py
      - scripts/dependency_archive.py
  workflow_dispatch:
    inputs:
      release_tag:
        description: New independent host release tag (deps-gui-host-<version>)
        type: string
        required: true

permissions:
  contents: read
  attestations: read

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: gui-hosts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build link inputs (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x64win
          - os: ubuntu-24.04
            target: x64glibc
          - os: macos-15
            target: arm64mac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-toolchain
      - name: Check host archive admission
        run: |
          python -m unittest discover -s scripts -p test_gui_host_artifacts.py
          python -m unittest discover -s scripts -p test_rust_license_inventory.py
      - name: Install GUI host build dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev
          fi
          rustup toolchain install 1.95.0 --profile minimal
      - name: Install the selected macOS Metal toolchain
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
          TOOLCHAINS: Metal
        run: |
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "TOOLCHAINS=Metal" >> "$GITHUB_ENV"
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        with:
          shared-key: gui-dependencies
          cache-workspace-crates: false
          cache-bin: false
          env-vars: ImageVersion CC CXX CFLAGS CXXFLAGS LDFLAGS SDKROOT MACOSX_DEPLOYMENT_TARGET GPUI_FXC_PATH DEVELOPER_DIR TOOLCHAINS
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Build the optimized host and its link inputs
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        shell: bash
        run: |
          python scripts/prepare_platforms.py
          python scripts/build_gui.py
          python scripts/gui_host_artifacts.py --target "${{ matrix.target }}" --output "gui-host-${{ matrix.target }}.tar" --roc roc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gui-host-${{ matrix.target }}
          path: gui-host-${{ matrix.target }}.tar
          retention-days: 30

  publish:
    name: Attest and release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'lukewilliamboswell/roc-signals'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: gui-host-*
          merge-multiple: true
          path: ${{ runner.temp }}/link-inputs
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/link-inputs/*.tar
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/release_dependencies.py --directory "$RUNNER_TEMP/link-inputs" --tag "$RELEASE_TAG" --kind gui-host
