name: macOS dependency releases

on:
  pull_request:
    paths:
      - dependencies/macos-stubs.json
      - scripts/build_macos_stubs.py
      - dependencies/macos-stubs/NOTICE
      - scripts/dependency_archive.py
      - scripts/dependency_artifacts.py
      - scripts/release_dependencies.py
      - scripts/test_dependency_artifacts.py
      - scripts/test_macos_stub_artifact.py
      - scripts/test_macos_dependencies.py
      - test/dependencies/macos_stubs.c
      - .github/workflows/macos-dependencies.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: New independent interface release tag (deps-macos-stubs-<version>)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: macos-dependencies-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package and test macOS interfaces
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - name: Check dependency admission failures
        run: python -m unittest scripts/test_dependency_artifacts.py scripts/test_macos_dependencies.py
      - name: Select pinned Xcode
        run: xcodebuild -version
      - name: Collect exact pinned Apple interfaces
        run: python scripts/build_macos_stubs.py --sdk "$DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" --xcode-license /Applications/Xcode_26.3.app/Contents/Resources/en.lproj/License.rtf --output '${{ runner.temp }}/dependencies'
      - name: Execute the exact candidate on macOS
        run: python scripts/test_macos_stub_artifact.py '${{ runner.temp }}/dependencies/macos-stubs-macos-sysroot.tar'
      - name: Check reproducibility in a second directory
        shell: bash
        run: |
          python scripts/build_macos_stubs.py --sdk "$DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" --xcode-license /Applications/Xcode_26.3.app/Contents/Resources/en.lproj/License.rtf --output '${{ runner.temp }}/rebuild'
          cmp '${{ runner.temp }}/dependencies/macos-stubs-macos-sysroot.tar' '${{ runner.temp }}/rebuild/macos-stubs-macos-sysroot.tar'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-stubs-macos-sysroot
          path: ${{ runner.temp }}/dependencies/*.tar
          retention-days: 30

  publish:
    name: Attest tested dependency artifacts
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: macos-stubs-*
          merge-multiple: true
          path: ${{ runner.temp }}/dependencies
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/dependencies/*.tar
      - name: Publish the tested bytes without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/release_dependencies.py --directory "$RUNNER_TEMP/dependencies" --tag "$RELEASE_TAG" --kind macos-stubs
