name: macOS interface dependency releases

on:
  pull_request:
    paths:
      - dependencies/macos-interfaces/interfaces.json
      - dependencies/macos-interfaces/PROVENANCE.md
      - gui-host.lock.json
      - scripts/build_macos_interfaces.py
      - scripts/build_macos_stubs.py
      - scripts/check_macos_interfaces.py
      - scripts/test_macos_interface_dependencies.py
      - scripts/test_macos_stubs.py
      - scripts/dependency_archive.py
      - scripts/dependency_artifacts.py
      - scripts/release_dependencies.py
      - .github/workflows/macos-interface-dependencies.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: New macOS interface release tag (deps-macos-interfaces-<version>)
        type: string
        required: true

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: macos-interface-dependencies-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Generate and final-link macOS interfaces
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Select the released host's matching sources
        id: host-source
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          lock = json.loads(Path("gui-host.lock.json").read_text())
          print("sha=" + lock["artifacts"]["gui-host-arm64mac"]["source_sha"])
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.host-source.outputs.sha }}
          path: .test-out/macos-host-source
          persist-credentials: false
      - name: Check generation, admission, and publication contracts
        run: python3 -m unittest scripts/test_macos_interface_dependencies.py scripts/test_macos_stubs.py
      - name: Generate and validate against the reviewed released host
        run: python3 scripts/build_macos_interfaces.py --output "$RUNNER_TEMP/dependencies" --host-lock gui-host.lock.json --host-source .test-out/macos-host-source --roc roc
      - name: Check reproducibility without rebuilding the host
        run: |
          python3 scripts/build_macos_interfaces.py --output "$RUNNER_TEMP/rebuild"
          cmp "$RUNNER_TEMP/dependencies/macos-interfaces-macos-sysroot.tar" "$RUNNER_TEMP/rebuild/macos-interfaces-macos-sysroot.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-interfaces-macos-sysroot
          path: ${{ runner.temp }}/dependencies/*.tar
          retention-days: 30

  publish:
    name: Attest tested macOS interfaces
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: macos-interfaces-*
          merge-multiple: true
          path: ${{ runner.temp }}/dependencies
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/dependencies/*.tar
      - name: Publish the tested bytes without rebuilding
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/release_dependencies.py --directory "$RUNNER_TEMP/dependencies" --tag "$RELEASE_TAG" --kind macos-interfaces
