name: Platform release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: New SemVer release or prerelease, without a v prefix
        type: string
        required: true
        default: 0.2.0
      validate_only:
        description: Build and smoke-test exact assets without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: platform-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Bundle the web platform from immutable inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7aff4132691ad4fc348abe9df146a57512b49bd6
        with:
          cache: 'true'
          cache-workload: release
      - uses: ./.github/actions/setup-roc
      - name: Validate release policy
        if: ${{ !inputs.validate_only }}
        uses: lukewilliamboswell/roc-automation/actions/check-release@7aff4132691ad4fc348abe9df146a57512b49bd6
        with:
          version: ${{ inputs.release_tag }}
          compiler-root: platform-web/main.roc
          allow-default-branch: 'true'
          allow-nightly-bootstrap: 'true'
      - name: Download, hash-verify, and bundle exact inputs
        env:
          RELEASE_VERSION: ${{ inputs.release_tag }}
        run: blueprint run release -- prepare --version "$RELEASE_VERSION" --directory "$RUNNER_TEMP/release"
      - name: Verify exact release inventory
        run: blueprint run release -- verify --directory "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-release
          path: ${{ runner.temp }}/release/
          retention-days: 30
          if-no-files-found: error

  smoke:
    name: Serve and smoke the release (${{ matrix.name }})
    needs: bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7aff4132691ad4fc348abe9df146a57512b49bd6
        with:
          cache: 'true'
          cache-workload: release-smoke
      - uses: ./.github/actions/setup-roc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: platform-release
          path: ${{ runner.temp }}/release
      - name: Serve the exact package and run all example smoke tests
        run: blueprint run release -- check --directory "$RUNNER_TEMP/release"

  publish:
    name: Publish the exact tested release
    if: ${{ !inputs.validate_only && github.ref == 'refs/heads/main' && github.repository == 'lukewilliamboswell/roc-signals' }}
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: platform-release
          path: ${{ runner.temp }}/release
      - name: Verify the exact tested bytes
        run: python3 scripts/release.py verify --directory "$RUNNER_TEMP/release"
      - name: Attest optional external provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{ runner.temp }}/release/*.tar.zst
            ${{ runner.temp }}/release/signals-examples.zip
            ${{ runner.temp }}/release/signals-release.json
      - name: Publish one immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish --directory "$RUNNER_TEMP/release"
