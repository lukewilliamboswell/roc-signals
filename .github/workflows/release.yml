name: Web release candidate

on:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: Validate archives without publishing, deploying or opening follow-ups
        type: boolean
        default: false
      release_tag:
        description: Independent package SemVer, without a v prefix
        type: string
        default: 0.2.0-rc1

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Release source tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - run: python3 scripts/test.py

  build-and-bundle:
    name: Build release archives
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release policy
        if: ${{ !inputs.nightly_validation }}
        uses: lukewilliamboswell/roc-automation/actions/check-release@13b98f8428993bf0dcca9fbaa3b7762ec3e25d34
        with:
          version: ${{ inputs.release_tag }}
          compiler-root: platform-web/main.roc
          allow-default-branch: 'true'
          allow-nightly-bootstrap: 'true'
      - uses: ./.github/actions/setup-toolchain
      - name: Prepare exact artifacts
        env:
          RELEASE_VERSION: ${{ inputs.release_tag || '0.2.0-rc1' }}
        run: python3 scripts/release.py prepare --version "$RELEASE_VERSION" --directory "$RUNNER_TEMP/platform-bundle"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-bundle
          path: ${{ runner.temp }}/platform-bundle/
          retention-days: 30

  test-bundle:
    name: Test release (${{ matrix.os }})
    needs: build-and-bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: platform-bundle
          path: ${{ runner.temp }}/platform-bundle
      - run: python3 scripts/release.py check --directory "$RUNNER_TEMP/platform-bundle"

  site:
    name: Prepare versioned site
    if: ${{ !inputs.nightly_validation }}
    needs: build-and-bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: platform-bundle
          path: ${{ runner.temp }}/platform-bundle
      - name: Install site tools
        run: |
          curl -fsSL https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/zola.tar.gz"
          tar -xzf "$RUNNER_TEMP/zola.tar.gz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/zola" /usr/local/bin/zola
          curl -fsSL https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64 -o "$RUNNER_TEMP/tailwindcss"
          sudo install "$RUNNER_TEMP/tailwindcss" /usr/local/bin/tailwindcss
      - name: Build supported site and retain previous URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/site_release.py build --directory "$RUNNER_TEMP/platform-bundle"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets
          path: ${{ runner.temp }}/platform-bundle/
          retention-days: 90

  publish:
    name: Publish tested release
    if: ${{ !inputs.nightly_validation && github.ref == 'refs/heads/main' }}
    needs: [source, test-bundle, site]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
      - name: Verify the complete tested asset set
        run: python3 scripts/release.py verify --directory "$RUNNER_TEMP/release-assets"
      - name: Attest final platform, browser, starter, and site artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{ runner.temp }}/release-assets/*.tar.zst
            ${{ runner.temp }}/release-assets/*.zip
            ${{ runner.temp }}/release-assets/signals-release.json
      - env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_VALIDATION: ${{ inputs.nightly_validation }}
        run: python3 scripts/release_followup.py publish --directory "$RUNNER_TEMP/release-assets"

  downloads:
    name: Verify published downloads
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
      - run: python3 scripts/release.py downloads --directory "$RUNNER_TEMP/release-assets"

  followup:
    name: Signed release follow-up
    needs: downloads
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
      - env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_VALIDATION: ${{ inputs.nightly_validation }}
        run: python3 scripts/release_followup.py followup --directory "$RUNNER_TEMP/release-assets"

  deploy-pages:
    name: Deploy supported release
    needs: downloads
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
      - run: python3 scripts/site_release.py assemble --directory "$RUNNER_TEMP/release-assets"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
