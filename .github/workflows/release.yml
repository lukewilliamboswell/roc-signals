name: Release

# Dispatched by a maintainer with a version. The build job runs
# `blueprint run release`, the same task `check` runs as its dry run, and
# uploads the assets. The publish job, which runs no repository code,
# creates a *draft* GitHub release with those exact files and the generated
# notes; the maintainer writes the release narrative on GitHub and publishes
# it. Release notes live on GitHub releases, not in the repository.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 0.3.0"
        type: string
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The latest Roc nightly, resolved once so every job of this run tests
  # with the same `roc` (roc-automation's model: the package compiler floats;
  # only the scripts' `roc-stable` is pinned in Blueprint.roc).
  nightly:
    name: Resolve the Roc nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.nightly.outputs.tag }}
    steps:
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Validate
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          DEFAULT: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          [ "$REF" = "$DEFAULT" ] || { echo "release from $DEFAULT only, not $REF"; exit 1; }
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "bad version $VERSION"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@60062e8909dcaf4bf449097132e440e9bc9c9ba6
        with:
          cache: 'true'
          cache-workload: release
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.nightly.outputs.tag }}
      - env:
          VERSION: ${{ inputs.version }}
        run: blueprint run release -- --version "$VERSION" --output-dir dist-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-candidate
          path: dist-release/
          if-no-files-found: error

  publish:
    name: Publish draft
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-candidate
          path: candidate
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          if gh release view "$VERSION" -R "$REPO" >/dev/null 2>&1; then
            echo "release $VERSION already exists"; exit 1
          fi
          gh release create "$VERSION" -R "$REPO" --draft --target "$TARGET" \
            --title "Roc Signals $VERSION" --notes-file candidate/release-notes.md \
            candidate/*.tar.zst candidate/*.mjs candidate/*.zip
