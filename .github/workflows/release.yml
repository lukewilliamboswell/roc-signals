name: Combined platform release candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: New combined prerelease SemVer, without a v prefix
        type: string
        required: true
        default: 0.2.0-rc3
      validate_only:
        description: Build and smoke-test exact assets without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: combined-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Bundle two platforms from immutable inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-roc
      - name: Validate release policy
        if: ${{ !inputs.validate_only }}
        uses: lukewilliamboswell/roc-automation/actions/check-release@13b98f8428993bf0dcca9fbaa3b7762ec3e25d34
        with:
          version: ${{ inputs.release_tag }}
          compiler-root: platform-web/main.roc
          allow-default-branch: 'true'
          allow-nightly-bootstrap: 'true'
      - name: Download, hash-verify, and bundle exact inputs
        env:
          RELEASE_VERSION: ${{ inputs.release_tag }}
        run: python3 scripts/release.py prepare --version "$RELEASE_VERSION" --directory "$RUNNER_TEMP/release"
      - name: Verify exact release inventory
        run: python3 scripts/release.py verify --directory "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: combined-platform-release
          path: ${{ runner.temp }}/release/
          retention-days: 30
          if-no-files-found: error

  smoke:
    name: Serve and smoke both packages (${{ matrix.name }})
    needs: bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-15
          - name: Windows x64
            os: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-roc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: combined-platform-release
          path: ${{ runner.temp }}/release
      - name: Install native GUI smoke runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6 libxkbcommon0 libxkbcommon-x11-0 weston xvfb xauth mesa-vulkan-drivers
      - name: Serve both exact packages and run all example smoke tests
        if: runner.os != 'Linux'
        run: python3 scripts/release.py check --directory "$RUNNER_TEMP/release"
      - name: Serve both exact packages and run all example smoke tests
        if: runner.os == 'Linux'
        env:
          SIGNALS_WAYLAND_SMOKE: '1'
        run: xvfb-run -a -s '-screen 0 1280x1024x24' python3 scripts/release.py check --directory "$RUNNER_TEMP/release"

  publish:
    name: Publish the exact tested combined release
    if: ${{ !inputs.validate_only && github.ref == 'refs/heads/main' && github.repository == 'lukewilliamboswell/roc-signals' }}
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: combined-platform-release
          path: ${{ runner.temp }}/release
      - name: Verify the exact tested bytes
        run: python3 scripts/release.py verify --directory "$RUNNER_TEMP/release"
      - name: Attest optional external provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{ runner.temp }}/release/*.tar.zst
            ${{ runner.temp }}/release/signals-examples.zip
            ${{ runner.temp }}/release/signals-release.json
      - name: Publish one immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish --directory "$RUNNER_TEMP/release"
