name: LLVM unwind dependency releases

on:
  pull_request:
    paths:
      - dependencies/unwind.json
      - dependencies/unwind/**
      - scripts/build_unwind.py
      - scripts/build_glibc.py
      - scripts/test_unwind_dependencies.py
      - scripts/dependency_archive.py
      - scripts/dependency_artifacts.py
      - scripts/release_dependencies.py
      - test/dependencies/unwind.cpp
      - test/dependencies/unwind.rs
      - test/dependencies/unwind-rust.c
      - scripts/test_unwind_rust.py
      - .github/workflows/unwind-dependencies.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: New independent unwind release tag (deps-unwind-<version>)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: unwind-dependencies-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test unwind
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check source admission and publication failures
        run: python3 -m unittest scripts/test_dependency_artifacts.py scripts/test_glibc_dependencies.py scripts/test_unwind_dependencies.py
      - name: Build from verified source and test the extracted candidate
        run: python3 scripts/build_unwind.py --output "$RUNNER_TEMP/dependencies"
      - name: Check reproducibility in another clean container
        run: |
          python3 scripts/build_unwind.py --output "$RUNNER_TEMP/rebuild"
          cmp "$RUNNER_TEMP/dependencies/unwind-x64glibc.tar" "$RUNNER_TEMP/rebuild/unwind-x64glibc.tar"
      - name: Install the pinned Rust probe compiler
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Check Rust panic recovery against the extracted candidate
        run: python3 scripts/test_unwind_rust.py --candidate "$RUNNER_TEMP/dependencies/unwind-x64glibc.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unwind-x64glibc
          path: ${{ runner.temp }}/dependencies/*.tar
          retention-days: 30

  publish:
    name: Attest tested dependency artifacts
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: unwind-*
          merge-multiple: true
          path: ${{ runner.temp }}/dependencies
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/dependencies/*.tar
      - name: Publish the tested bytes without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/release_dependencies.py --directory "$RUNNER_TEMP/dependencies" --tag "$RELEASE_TAG" --kind unwind
