name: Web host inputs

# Runner intent and build modes: www/content/docs/contributing.md#ci-intent-and-runner-matrix

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: New immutable dependency tag (deps-web-hosts-<version>)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: web-hosts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test complete web host set
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7aff4132691ad4fc348abe9df146a57512b49bd6
        with:
          cache: 'true'
          cache-workload: dev
      - uses: ./.github/actions/setup-roc
      - run: blueprint run unittest -- discover -s scripts -p test_web_host_artifacts.py
      - name: Build once and exercise native and Wasm application paths
        run: blueprint run test -- roc-check roc-test native wasm
      - name: Package the exact tested outputs without rebuilding
        run: blueprint run web-hosts -- --output "$RUNNER_TEMP/web-hosts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-hosts
          path: ${{ runner.temp }}/web-hosts/*.tar
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Attest and release web host inputs
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'lukewilliamboswell/roc-signals'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: web-hosts
          path: ${{ runner.temp }}/web-hosts
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/web-hosts/*.tar
      - name: Publish the exact tested bytes and content-hash lock
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/release_web_hosts.py --directory "$RUNNER_TEMP/web-hosts" --tag "$RELEASE_TAG"
