name: Web host inputs

on:
  pull_request:
    paths:
      - .github/workflows/web-hosts.yml
      - .github/actions/setup-toolchain/**
      - src/native_host.zig
      - src/wasm_host.zig
      - src/signals/**
      - build.zig
      - build.zig.zon
      - scripts/web_host_artifacts.py
      - scripts/test_web_host_artifacts.py
      - scripts/release_web_hosts.py
      - scripts/dependency_archive.py
      - scripts/dependency_artifacts.py
      - scripts/release_dependencies.py
      - scripts/test_dependency_artifacts.py
      - LICENSE
  workflow_dispatch:
    inputs:
      release_tag:
        description: New immutable dependency tag (deps-web-hosts-<version>)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: web-hosts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test complete web host set
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-toolchain
      - name: Install required browser stack instrumentation
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '23.9.0'
      - run: python3 -m unittest discover -s scripts -p test_web_host_artifacts.py
      - name: Build once and exercise native and Wasm application paths
        run: python3 scripts/test.py roc-check roc-test native wasm
      - name: Package the exact tested outputs without rebuilding
        run: python3 scripts/web_host_artifacts.py --output "$RUNNER_TEMP/web-hosts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-hosts
          path: ${{ runner.temp }}/web-hosts/*.tar
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Attest and release web host inputs
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'lukewilliamboswell/roc-signals'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: web-hosts
          path: ${{ runner.temp }}/web-hosts
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/web-hosts/*.tar
      - name: Publish the exact tested bytes and content-hash lock
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/release_web_hosts.py --directory "$RUNNER_TEMP/web-hosts" --tag "$RELEASE_TAG"
