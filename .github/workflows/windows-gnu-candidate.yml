name: Windows GNU host candidate
on:
  pull_request:
    paths:
      - .github/workflows/windows-gnu-candidate.yml
      - scripts/windows_fxc_inventory.ps1
      - scripts/windows_gnu_candidate.py
      - scripts/test_windows_gnu_candidate.py
      - scripts/windows_gnu_coff.py
      - scripts/test_windows_gnu_coff.py
      - scripts/windows_gnu_apps_candidate.py
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [inventory, build, apps]
        default: inventory
      runtime_run:
        type: string
        default: ''
      runtime_source:
        type: string
        default: ''
      runtime_sha256:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install native build toolchain
        if: inputs.mode == 'build'
        run: rustup toolchain install 1.95.0 --profile minimal --target x86_64-pc-windows-gnullvm
      - uses: ./.github/actions/setup-toolchain
        if: inputs.mode == 'apps'
      - name: Check candidate structural contracts
        run: |
          python -m unittest discover -s scripts -p test_windows_gnu_candidate.py
          python -m unittest discover -s scripts -p test_windows_gnu_coff.py
      - name: Capture tool inventory or build raw candidate archives
        if: inputs.mode != 'apps'
        env:
          CANDIDATE_MODE: ${{ inputs.mode || 'inventory' }}
        run: >-
          python scripts/windows_gnu_candidate.py $env:CANDIDATE_MODE
          --output "$env:RUNNER_TEMP/windows-gnu-candidate"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-gnu-${{ inputs.mode || 'inventory' }}
          path: |
            ${{ runner.temp }}/windows-gnu-candidate/*.json
            ${{ runner.temp }}/windows-gnu-candidate/*.jsonl
            ${{ runner.temp }}/windows-gnu-candidate/fxc.stdout
            ${{ runner.temp }}/windows-gnu-candidate/fxc.stderr
            ${{ runner.temp }}/windows-gnu-candidate/Cargo.lock
            ${{ runner.temp }}/windows-gnu-candidate/payload/
            ${{ runner.temp }}/windows-gnu-candidate/shaders/
          retention-days: 7
      - name: Validate native applications and HTTP candidate bundle
        if: inputs.mode == 'apps'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN: ${{ inputs.runtime_run }}
          RUNTIME_SOURCE: ${{ inputs.runtime_source }}
          RUNTIME_SHA256: ${{ inputs.runtime_sha256 }}
        run: >-
          python scripts/windows_gnu_apps_candidate.py
          "--runtime-run=$env:RUNTIME_RUN" "--runtime-source=$env:RUNTIME_SOURCE"
          "--runtime-sha256=$env:RUNTIME_SHA256" --output "$env:RUNNER_TEMP/windows-gnu-apps"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && inputs.mode == 'apps'
        with:
          name: windows-gnu-native-apps-candidate
          path: |
            ${{ runner.temp }}/windows-gnu-apps/proof.json
            ${{ runner.temp }}/windows-gnu-apps/platform-gui/normalization.json
            ${{ runner.temp }}/windows-gnu-apps/platform-gui/CANDIDATE.json
            ${{ runner.temp }}/windows-gnu-apps/bundle/
            ${{ runner.temp }}/windows-gnu-apps/local-apps/*.exe
            ${{ runner.temp }}/windows-gnu-apps/http-apps/*.exe
          retention-days: 7
