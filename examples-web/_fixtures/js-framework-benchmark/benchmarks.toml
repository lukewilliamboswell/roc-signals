schema_version = 1
browser_harness_issue = "https://github.com/lukewilliamboswell/roc-signals/issues/19"

# This manifest is the durable contract between the native performance runner and
# the browser adapter under benchmarks/js-framework-benchmark/. Specs prove each
# operation and provide native engine measurements; the official harness owns
# end-to-end DOM, memory, startup, and transferred-size measurements.

[[operations]]
id = "create_1k"
official_name = "create rows"
spec = "specs/create_1k.scm"
rows = 1000
warmup_iterations = 0
native_iterations = 1
native_samples = 7

[[operations]]
id = "replace_1k"
official_name = "replace all rows"
spec = "specs/replace_1k.scm"
rows = 1000
warmup_iterations = 5
native_iterations = 1
native_samples = 7

[[operations]]
id = "update_10k"
serial_native_spec = true
native_spec_timeout_seconds = 60
official_name = "partial update"
spec = "specs/update_10k.scm"
rows = 10000
warmup_iterations = 5
native_iterations = 1
native_samples = 7

[[operations]]
id = "select_1k"
official_name = "select row"
spec = "specs/select_1k.scm"
rows = 1000
warmup_iterations = 5
native_iterations = 1
native_samples = 7

[[operations]]
id = "swap_1k"
official_name = "swap rows"
spec = "specs/swap_1k.scm"
rows = 1000
warmup_iterations = 5
native_iterations = 1
native_samples = 7

[[operations]]
id = "remove_1k"
official_name = "remove row"
spec = "specs/remove_1k.scm"
rows = 1000
warmup_iterations = 5
native_iterations = 1
native_samples = 7

[[operations]]
id = "create_10k"
serial_native_spec = true
native_spec_timeout_seconds = 60
official_name = "create many rows"
spec = "specs/create_10k.scm"
rows = 10000
warmup_iterations = 0
native_iterations = 1
native_samples = 1

[[operations]]
id = "append_1k_to_10k"
serial_native_spec = true
native_spec_timeout_seconds = 60
official_name = "append rows to large table"
spec = "specs/append_1k_to_10k.scm"
rows = 11000
warmup_iterations = 0
native_iterations = 1
native_samples = 1

[[operations]]
id = "clear_10k"
serial_native_spec = true
native_spec_timeout_seconds = 60
official_name = "clear rows"
spec = "specs/clear_10k.scm"
rows = 10000
warmup_iterations = 0
native_iterations = 1
native_samples = 1

# Memory cases run through the official browser adapter. `actions` names stable
# DOM ids so the manifest and adapter do not duplicate application meaning.

[[memory_scenarios]]
id = "ready_memory"
official_name = "ready memory"
provider = "browser_process_memory"
availability = "official_browser_adapter"
actions = []

[[memory_scenarios]]
id = "run_memory"
official_name = "run memory"
provider = "browser_process_memory"
availability = "official_browser_adapter"
actions = ["run"]

[[memory_scenarios]]
id = "update_memory"
official_name = "update memory"
provider = "browser_process_memory"
availability = "official_browser_adapter"
actions = ["run", "update", "update", "update", "update", "update"]

[[memory_scenarios]]
id = "replace_memory"
official_name = "replace memory"
provider = "browser_process_memory"
availability = "official_browser_adapter"
actions = ["run", "run", "run", "run", "run"]

[[memory_scenarios]]
id = "repeated_clear_memory"
official_name = "repeated clear memory"
provider = "browser_process_memory"
availability = "official_browser_adapter"
actions = ["run", "clear", "run", "clear", "run", "clear", "run", "clear", "run", "clear"]

# These measurements are supplied by the official browser harness. Keeping them
# in the same validated contract prevents a comparison from silently omitting
# startup or payload evidence that native and Node execution cannot produce.

[[browser_metrics]]
id = "startup_time"
official_name = "startup time"
provider = "browser_navigation"
availability = "official_browser_adapter"

[[browser_metrics]]
id = "consistently_interactive"
official_name = "consistently interactive"
provider = "lighthouse"
availability = "official_browser_adapter"

[[browser_metrics]]
id = "script_bootup_time"
official_name = "script bootup time"
provider = "lighthouse"
availability = "official_browser_adapter"

[[browser_metrics]]
id = "main_thread_work_cost"
official_name = "main thread work cost"
provider = "lighthouse"
availability = "official_browser_adapter"

[[browser_metrics]]
id = "total_byte_weight"
official_name = "total byte weight"
provider = "lighthouse"
availability = "official_browser_adapter"
