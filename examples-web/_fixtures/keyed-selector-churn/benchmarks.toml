schema_version = 1

# This fixture is not benchmarked (examples.toml sets bench = false); the
# manifest exists so the native spec runner gives the 10,000-row cases the
# serial worker slot and longer timeout large structural fixtures need.

[[operations]]
id = "remove_one_10k"
official_name = "remove one row from 10,000"
spec = "specs/remove_one_10k.scm"
rows = 10000
serial_native_spec = true
native_spec_timeout_seconds = 60
warmup_iterations = 0
native_iterations = 1
native_samples = 1

