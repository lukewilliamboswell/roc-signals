schema_version = 1
browser_harness_issue = "https://github.com/lukewilliamboswell/roc-signals/issues/19"

# This manifest is the durable contract between the native performance runner and
# the eventual js-framework-benchmark browser adapter. Specs prove the operation
# and provide native engine measurements; browser_duration is the future
# end-to-end DOM timing reported by the official harness.

[[operations]]
id = "create_1k"
official_name = "create rows"
spec = "specs/create_1k.scm"
rows = 1000
warmup_iterations = 0
native_iterations = 1
native_samples = 7

[[operations]]
id = "replace_1k"
official_name = "replace all rows"
spec = "specs/replace_1k.scm"
rows = 1000
warmup_iterations = 5
native_iterations = 1
native_samples = 7

[[operations]]
id = "update_10k"
official_name = "partial update"
spec = "specs/update_10k.scm"
rows = 10000
warmup_iterations = 5
native_iterations = 1
native_samples = 7

[[operations]]
id = "select_1k"
official_name = "select row"
spec = "specs/select_1k.scm"
rows = 1000
warmup_iterations = 5
native_iterations = 1
native_samples = 7

[[operations]]
id = "swap_1k"
official_name = "swap rows"
spec = "specs/swap_1k.scm"
rows = 1000
warmup_iterations = 5
native_iterations = 1
native_samples = 7

[[operations]]
id = "remove_1k"
official_name = "remove row"
spec = "specs/remove_1k.scm"
rows = 1000
warmup_iterations = 5
native_iterations = 1
native_samples = 7

[[operations]]
id = "create_10k"
official_name = "create many rows"
spec = "specs/create_10k.scm"
rows = 10000
warmup_iterations = 0
native_iterations = 1
native_samples = 1

[[operations]]
id = "append_1k_to_10k"
official_name = "append rows to large table"
spec = "specs/append_1k_to_10k.scm"
rows = 11000
warmup_iterations = 0
