warmup_iterations = 0
native_iterations = 1
native_samples = 1

# Memory cases require the future real-browser submission adapter. Issue #19
# owns only the Node/Wasm-controlled measurements that can inform that work.
# `actions` names stable DOM ids so an adapter need not duplicate application meaning.

[[memory_scenarios]]
id = "ready_memory"
official_name = "ready memory"
provider = "browser_process_memory"
availability = "deferred_issue_19"
actions = []

[[memory_scenarios]]
id = "run_memory"
official_name = "run memory"
provider = "browser_process_memory"
availability = "deferred_issue_19"
actions = ["run"]

[[memory_scenarios]]
id = "update_memory"
official_name = "update memory"
provider = "browser_process_memory"
availability = "deferred_issue_19"
actions = ["run", "update", "update", "update", "update", "update"]

[[memory_scenarios]]
id = "replace_memory"
official_name = "replace memory"
provider = "browser_process_memory"
availability = "deferred_issue_19"
actions = ["run", "run", "run", "run", "run"]

[[memory_scenarios]]
id = "repeated_clear_memory"
official_name = "repeated clear memory"
provider = "browser_process_memory"
availability = "deferred_issue_19"
actions = ["run", "clear", "run", "clear", "run", "clear", "run", "clear", "run", "clear"]

# These measurements require a future real-browser/Lighthouse adapter outside
# issue #19. Keeping them in the same validated contract prevents that adapter
# from silently omitting a result even though native and Node execution cannot
# produce it.

[[browser_metrics]]
id = "startup_time"
official_name = "startup time"
provider = "browser_navigation"
availability = "deferred_issue_19"

[[browser_metrics]]
id = "consistently_interactive"
official_name = "consistently interactive"
provider = "lighthouse"
availability = "deferred_issue_19"

[[browser_metrics]]
id = "script_bootup_time"
official_name = "script bootup time"
provider = "lighthouse"
availability = "deferred_issue_19"

[[browser_metrics]]
id = "main_thread_work_cost"
official_name = "main thread work cost"
provider = "lighthouse"
availability = "deferred_issue_19"

[[browser_metrics]]
id = "total_byte_weight"
official_name = "total byte weight"
provider = "lighthouse"
availability = "deferred_issue_19"
