# Wasm size budgets checked by `python3 scripts/test.py size`.
#
# Generated from a reproduced baseline with 1% headroom above the
# measured value. Budgets are explicit numbers so a regression fails loudly.
# Increasing a budget is a deliberate, reviewed decision: explain the cause
# (compiler upgrade, accepted feature cost) in the pull request. Never
# regenerate this file automatically to bless a larger artifact, and never
# derive it from an instrumented or profiler build. Mandatory production stack
# checks are included. These values track test/size/performance-baseline.json;
# the matched earlier build is test/size/performance-before.json. See
# docs/profiling.md for the measured cost of persistent indexes, sparse edit
# journals, grouped retirement, and bounded command retention.
#
# Regenerate after an accepted change with:
#   python3 scripts/wasm_size.py --write-budgets .test-out/size/<label>/report.json

[baseline]
revision = "a878eb59ef902e0b5d1f5c1abe8cb8f756e2a5e8"
roc = "Roc compiler version nightly-2026-09-12-220fd47"
zig = "0.16.0"
compression = "node-zlib"
headroom_percent = 1

