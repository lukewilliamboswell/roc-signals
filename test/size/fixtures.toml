# Fixed fixture set measured by `scripts/wasm_size.py`.
#
# Each entry builds `source` as a normal production Wasm application against
# an isolated copy of `platform/`. Keep the set stable: adding or reordering
# fixtures changes the cumulative figures that `--compare` reports, and every
# fixture here needs a matching entry in `budgets.toml`.

