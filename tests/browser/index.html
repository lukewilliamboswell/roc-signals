<!doctype html>
<html><head><meta charset="utf-8"><title>roc-signals spec replay</title></head>
<body><div id="app"></div>
<script type="module">
import { mountRocEngineApp } from "./runtime.mjs";
const params = new URLSearchParams(location.search);
try {
  // An app's own port handlers, when a test names their module (the soak
  // mounts an example with them); spec replays answer ports themselves.
  const ports = window.__portsModule ? { ports: (await import(window.__portsModule)).default } : {};
  window.__rt = await mountRocEngineApp({ wasmUrl: params.get("wasm") ?? "app.wasm", root: document.getElementById("app"), manualEffects: !!window.__manualFx, manualIntervals: true, ...ports, ...(window.__mountOptions ?? {}) });
  window.__ready = true;
} catch (e) {
  window.__error = String(e && e.stack || e);
}
</script></body></html>
