# The examples the site shows. Each runs on the web platform from the entry
# point `source` names; its specs run natively and in Chrome. An example may
# list `scripts` its page loads before the app mounts, name its port
# handlers' module in `ports` (a file beside its app.wasm whose default
# export site.mjs passes as the `ports` mount option), name its simulated
# service in `backend` (a module beside its app.wasm whose default export,
# `createBackend()`, returns a request handler that site.mjs turns into the
# mount's `fetch`; see examples/conduit/backend.mjs), and list the files it
# downloads at run time in `data`. scripts/site.roc copies every file named
# here beside the example's app.wasm; each names a file directly in the
# example's directory.
#
# A script's `src` is a URL (with its `integrity`) or a file of the example's
# own; `shared` in its place names a file in examples/shared/, the JavaScript
# several examples load (custom elements such as `plume-chart`), which the
# site serves once at examples/shared/. `module = true` loads it as a module.
#
# The examples index shows the `sections` below in order, and in each the
# examples whose `section` names it, in the order they appear here: a
# learning path from plain reactive state to workers. Each example's
# `features` are its chips, drawn from one vocabulary so a reader can follow
# a feature across examples: Derived values, Keyed lists, Components, Forms,
# HTTP, Local storage, Intervals, Routing, Custom elements, Ports, Workers,
# Cancellation, Files, Preparations. `what_to_try` is one line telling a
# reader what to do to see the point of the example, where that helps;
# `featured = true` draws an example as its section's wide card.

[[sections]]
id = "basics"
title = "Reactive basics"
blurb = "State, derived values, keyed lists and components. Each change updates exactly what depends on it, and nothing leaves the page."

[[sections]]
id = "effects"
title = "Effects and the network"
blurb = "Requests, timers, storage and the address bar, asked for by the app and answered back into it; each example talks to a simulated service that lives beside it."

[[sections]]
id = "ports"
title = "JavaScript through ports"
blurb = "When an app needs a browser API the platform does not model, its own JavaScript answers typed requests and sends messages, and nothing else."

[[sections]]
id = "workers"
title = "Workers and files"
blurb = "Roc tasks running in Web Workers, and files that never pass through the page: the page stays responsive however long the work takes."

[[examples]]
slug = "markdown-editor"
