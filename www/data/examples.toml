description = "Open a log of any size, or generate one: a worker indexes it once and keeps the index and the file, not its text, and an overview, a search and a viewer each ask that prepared index their own questions, reading only the lines they show."
source = "examples/log-explorer/main.roc"
specs = "examples/log-explorer/specs"
public = true
