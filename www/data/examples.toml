[[examples]]
slug = "worker-lab"
title = "Worker Lab"
description = "Roc tasks counting primes and drawing Mandelbrot tiles in Web Workers: a job grid with cancel and supersession, an in-flight bound you can see, a heartbeat that never stalls, and a live pool panel."
source = "examples/worker-lab/main.roc"
specs = "examples/worker-lab/specs"
public = true
# Optional for any example: `max_workers` and `workers` set the mount's pool
# (data-signals-max-workers / data-signals-workers); the page URL's
# `maxWorkers` and `workers` query parameters override them.

# The pool panel, `worker-pool-panel`: drawn from the runtime's monitor once
# site.mjs announces the runtime (`roc-signals:runtime`).
[[examples.scripts]]
src = "pool-panel.mjs"
module = true

[[examples]]
slug = "csv-converter"
title = "CSV Converter"
description = "Drop a CSV of any size and convert it to TSV or JSON lines in a worker task, a chunk at a time, without its bytes passing through the page; preview the result, save it, or download a sample into a file first."
source = "examples/csv-converter/main.roc"
specs = "examples/csv-converter/specs"
public = true

[[examples]]
slug = "reading-list"
title = "Reading List"
description = "A reading list kept in the browser's IndexedDB through ports: the books survive a reload, a change in one tab shows in every other, and the only JavaScript the app brings is its port handlers."
source = "examples/reading-list/main.roc"
specs = "examples/reading-list/specs"
public = true
# The app's port handlers (IndexedDB and a BroadcastChannel), its own
# JavaScript, which site.mjs passes as the `ports` mount option.
ports = "ports.mjs"

[[examples]]
slug = "log-explorer"
