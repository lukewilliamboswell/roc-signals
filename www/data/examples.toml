[[examples]]
slug = "conduit"
title = "Conduit"
description = "RealWorld (Conduit) demo: hash-routed feeds, sessions, profiles, markdown articles, comments, favorites, follows, and server-confirmed write paths."
source = "examples/conduit/main.roc"
specs = "examples/conduit/specs"
public = true
