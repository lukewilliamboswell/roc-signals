# The examples the site shows, in index order. Each runs on the web
# platform from the entry point `source` names; its specs run natively and
# in Chrome. An example may list `scripts` its page loads before the app
# mounts, name its port handlers' module in `ports` (a file beside its
# app.wasm whose default export site.mjs passes as the `ports` mount option),
# and name its simulated service in `backend` (a module beside its app.wasm
# whose default export, `createBackend()`, returns a request handler that
# site.mjs turns into the mount's `fetch`; see examples/conduit/backend.mjs).

[[examples]]
slug = "field-notes"
title = "Field Notes"
description = "Offline-first note capture with an outbox that drains on reconnect, per-note sync status, optimistic writes and rollback."
source = "examples/field-notes/main.roc"
specs = "examples/field-notes/specs"
public = true
# Its simulated sync service, the example's own JavaScript.
backend = "backend.mjs"

[[examples]]
slug = "data-grid"
title = "Data Grid"
description = "A 1200-row sortable, filterable, editable grid that renders one page at a time while a summary row aggregates the full dataset."
source = "examples/data-grid/main.roc"
specs = "examples/data-grid/specs"
public = true

[[examples]]
slug = "form-builder"
title = "Form Builder"
description = "A field designer beside a live preview that validates as you type, where tightening a rule in the designer invalidates preview input across two levels of signal graph."
source = "examples/form-builder/main.roc"
specs = "examples/form-builder/specs"
public = true

[[examples]]
slug = "status-page"
title = "Status Page"
description = "A public status page rolling four independent service checks into one derived status, with visibility-gated polling, a Plume uptime chart and an incident timeline."
source = "examples/status-page/main.roc"
specs = "examples/status-page/specs"
public = true
# Its simulated checks and incident feed, the example's own JavaScript.
backend = "backend.mjs"

# The uptime chart: Plotly from its pinned CDN URL (the version Plume 0.5.0
# pins), then the example's `plume-chart` element. Both are deferred, so they
# run in this order before the app mounts. A relative `src` is a file in
# examples/status-page/ that scripts/site.roc copies beside app.wasm.
[[examples.scripts]]
src = "https://cdn.plot.ly/plotly-4.2.0.min.js"
integrity = "sha384-F4AdcRk3NYRZZUZ7qARRp/wPkwvdta756IMuHDAZcmtM5nuHKykTbDJd7N9h+Qff"

[[examples.scripts]]
src = "plume-chart.mjs"
module = true

[[examples]]
slug = "kanban-board"
title = "Kanban Board"
description = "A four-column board with cross-column moves, within-column reorder, per-column WIP limits, and derived counts over keyed rows."
source = "examples/kanban-board/main.roc"
specs = "examples/kanban-board/specs"
public = true

[[examples]]
slug = "spreadsheet-lite"
title = "Spreadsheet Lite"
description = "An 8x12 formula grid with cell references, precedence, SUM ranges, error propagation, and cycle detection over fixed-point arithmetic."
source = "examples/spreadsheet-lite/main.roc"
specs = "examples/spreadsheet-lite/specs"
public = true

[[examples]]
slug = "markdown-editor"
title = "Markdown Editor"
description = "One markdown source string feeding four independently derived views: preview, outline, statistics, and reading time."
source = "examples/markdown-editor/main.roc"
specs = "examples/markdown-editor/specs"
